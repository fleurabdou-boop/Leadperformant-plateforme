# Lead Performant — configuration serveur (Hostinger, Apache/LiteSpeed)
Options -Indexes
DirectoryIndex index.html index.php
ErrorDocument 404 /404.html

<IfModule mod_rewrite.c>
RewriteEngine On
# 1. HTTPS obligatoire
RewriteCond %{HTTPS} off
RewriteRule ^ https://www.leadperformant.com%{REQUEST_URI} [L,R=301]
# 2. Une seule adresse : www.leadperformant.com (évite le contenu dupliqué)
RewriteCond %{HTTP_HOST} ^leadperformant\.com$ [NC]
RewriteRule ^ https://www.leadperformant.com%{REQUEST_URI} [L,R=301]
# 3. Ancienne rubrique Médiation : redirigée vers le pôle Médiation et gestion des conflits
RewriteRule ^mediation/?$ https://www.leadperformant.com/mediation-gestion-des-conflits/ [L,R=301]
# 3 bis. Maison mère à deux pôles (novembre 2026) : les anciens pôles Art oratoire et Leadership sont réunis
RewriteRule ^art-oratoire/?$ https://www.leadperformant.com/art-oratoire-leadership/ [L,R=301]
RewriteRule ^leadership/?$ https://www.leadperformant.com/art-oratoire-leadership/ [L,R=301]
# 4. Programme renommé
RewriteRule ^formations/eloquence-insertion/?$ https://www.leadperformant.com/formations/eloquence-levier-professionnel/ [L,R=301]
# 5. Page « À propos » retirée provisoirement (redirection temporaire)
RewriteRule ^a-propos/?$ https://www.leadperformant.com/ [L,R=302]
# 6. Plateforme de formation : dossiers internes fermés, adresses lisibles des sessions et des produits
RewriteRule ^_lp(/|$) - [F,L]
RewriteRule ^gestion/_admin\.php$ - [F,L]
RewriteRule ^sessions/([a-z0-9-]+)/?$ /sessions/index.php?s=$1 [L,QSA]
RewriteRule ^boutique/([a-z0-9-]+)/?$ /boutique/produit.php?p=$1 [L,QSA]
</IfModule>

# Fichiers qui ne doivent jamais être servis
<FilesMatch "\.(zip|csv|bak|log|py|md|sqlite|lock)$">
  Require all denied
</FilesMatch>

<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(self)"
  Header always set Strict-Transport-Security "max-age=31536000"
</IfModule>

<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css "access plus 7 days"
  ExpiresByType application/javascript "access plus 7 days"
  ExpiresByType image/svg+xml "access plus 30 days"
  ExpiresByType image/webp "access plus 30 days"
  ExpiresByType image/jpeg "access plus 30 days"
  ExpiresByType font/woff2 "access plus 1 year"
  ExpiresByType application/pdf "access plus 30 days"
  ExpiresByType text/html "access plus 0 seconds"
</IfModule>

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml application/xml
</IfModule>
