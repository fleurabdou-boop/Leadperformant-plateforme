# --- Plateforme de formation : à insérer dans le .htaccess racine, dans le bloc <IfModule mod_rewrite.c>, après la règle 5 ---
# 6. Pages de session et fiches produits (adresses lisibles)
RewriteRule ^sessions/([a-z0-9-]+)/?$ /sessions/index.php?s=$1 [L,QSA]
RewriteRule ^boutique/([a-z0-9-]+)/?$ /boutique/produit.php?p=$1 [L,QSA]
# 7. Fichiers internes jamais servis
RewriteRule ^_lp(/|$) - [F,L]
RewriteRule ^gestion/_admin\.php$ - [F,L]
